version: '3.8'

services:
  journalsearch-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journalsearch_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-true}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-Mid-client-FodF2EHkOGnjpDEm}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID:-G740209003}
    env_file:
      - .env
